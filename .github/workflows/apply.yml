# Déploiement MANUEL : Actions > Terraform apply > Run workflow.
# L'environnement GitHub « production » exige une approbation humaine, et
# c'est le seul à pouvoir obtenir le rôle d'administration AWS (voir OIDC).
name: Terraform apply

on:
  workflow_dispatch:
    inputs:
      env:
        description: Environnement à déployer
        type: choice
        options: [account, dev, prod]

permissions: {}

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      TF_VAR_state_bucket: ${{ vars.TF_STATE_BUCKET }}
      TF_VAR_alert_emails: ${{ vars.ALERT_EMAILS }}
      STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TARGET_ENV: ${{ inputs.env }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.13.5
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: eu-west-3
      - name: terraform apply
        run: |
          cd "envs/$TARGET_ENV"
          terraform init -input=false -backend-config="bucket=$STATE_BUCKET" -backend-config="region=eu-west-3"
          terraform apply -input=false -auto-approve
