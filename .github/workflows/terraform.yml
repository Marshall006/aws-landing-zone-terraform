# =============================================================================
# CI Terraform
#   Sans compte AWS (toujours exécuté) :
#     fmt -> validate -> tests unitaires (fournisseur simulé) -> TFLint
#     -> Checkov (sécurité) -> Infracost (coûts, si clé API)
#   Avec compte AWS (dès que la variable AWS_PLAN_ROLE_ARN est définie) :
#     plan réel de chaque environnement, via OIDC (aucune clé stockée)
# =============================================================================
name: Terraform

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_VERSION: 1.13.5
  TF_IN_AUTOMATION: "true"

jobs:
  static:
    name: Format, validation, lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: Format
        run: terraform fmt -check -recursive -diff
      - name: Validation de chaque module et environnement
        run: |
          for dir in bootstrap modules/* envs/*/; do
            [ -n "$(ls "$dir"/*.tf 2>/dev/null)" ] || continue
            echo "::group::$dir"
            terraform -chdir="$dir" init -backend=false -input=false >/dev/null
            terraform -chdir="$dir" validate
            echo "::endgroup::"
          done
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
      - name: TFLint
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tflint --init
          tflint --recursive --config "$PWD/.tflint.hcl" --format compact

  tests:
    name: Tests unitaires (AWS simulé)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        module: [network, security-baseline, github-oidc, finops]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: terraform test
        working-directory: modules/${{ matrix.module }}
        run: |
          terraform init -backend=false -input=false >/dev/null
          terraform test -verbose

  security:
    name: Sécurité (Checkov)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install checkov
      - name: Checkov (exclusions justifiées dans .checkov.yaml)
        run: checkov -d . --config-file .checkov.yaml -o cli -o sarif --output-file-path console,checkov.sarif
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        if: always() && github.event_name == 'push' && hashFiles('checkov.sarif') != ''
        with:
          sarif_file: checkov.sarif
          category: checkov

  cost:
    name: Estimation des coûts (Infracost)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.INFRACOST_API_KEY != ''
        with:
          persist-credentials: false
      - uses: infracost/actions/setup@a5783eb98adc93aa7a0049fce0abb06fdd30770a # v5.0.1
        if: env.INFRACOST_API_KEY != ''
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}
      - name: Coût mensuel estimé par environnement
        if: env.INFRACOST_API_KEY != ''
        run: |
          for env in dev prod; do
            echo "### $env" >> "$GITHUB_STEP_SUMMARY"
            infracost breakdown --path "envs/$env" --format table | tee -a "$GITHUB_STEP_SUMMARY"
          done
      - name: Ignoré (aucune clé Infracost)
        if: env.INFRACOST_API_KEY == ''
        run: echo "Ajoutez le secret INFRACOST_API_KEY (gratuit sur infracost.io) pour estimer les coûts."

  plan:
    name: Plan AWS réel (${{ matrix.env }})
    needs: [static, tests, security]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # jeton OIDC échangé contre un rôle AWS temporaire
    strategy:
      fail-fast: false
      matrix:
        env: [account, dev, prod]
    env:
      ROLE_ARN: ${{ vars.AWS_PLAN_ROLE_ARN }}
      STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_VAR_state_bucket: ${{ vars.TF_STATE_BUCKET }}
      TF_VAR_alert_emails: ${{ vars.ALERT_EMAILS }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.ROLE_ARN != ''
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        if: env.ROLE_ARN != ''
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        if: env.ROLE_ARN != ''
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: eu-west-3
      - name: terraform plan
        if: env.ROLE_ARN != ''
        working-directory: envs/${{ matrix.env }}
        run: |
          terraform init -input=false -backend-config="bucket=$STATE_BUCKET" -backend-config="region=eu-west-3"
          terraform plan -input=false -lock=false -no-color | tee plan.txt
          { echo '### Plan `${{ matrix.env }}`'; echo '```'; tail -n 40 plan.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Ignoré (compte AWS non configuré)
        if: env.ROLE_ARN == ''
        run: echo "Définissez les variables AWS_PLAN_ROLE_ARN, TF_STATE_BUCKET et ALERT_EMAILS (voir README)."
